[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temp-volt-relationship"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
    "mlflow>=2.0.0",
    "optuna>=3.0.0",
    "joblib>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
py-modules = [
    "battery_dataset",
    "DataProcess",
    "device_utils",
    "evaluate",
    "forecast",
    "lisocl2_forecast",
    "ml_tabular_pipeline",
    "optimize",
    "run_tests",
    "tall_to_tensor",
    "train",
    "voltage_forecast_model",
]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
